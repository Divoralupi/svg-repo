<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="spear-title">
  <title id="spear-title">Lancia runica</title>
  <defs>
    <!-- Asta: legno scuro con riflesso bronzeo -->
    <linearGradient id="spear-shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a3c"/>
      <stop offset="0.35" stop-color="#4a3820"/>
      <stop offset="0.7" stop-color="#21180e"/>
      <stop offset="1" stop-color="#0e0a06"/>
    </linearGradient>
    <!-- Metallo nero del puntale e del collare -->
    <linearGradient id="spear-iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5f70"/>
      <stop offset="0.4" stop-color="#23252e"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="spear-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d58c"/>
      <stop offset="0.5" stop-color="#c49a4a"/>
      <stop offset="1" stop-color="#6e5222"/>
    </linearGradient>
    <!-- Lama di cristallo luminoso -->
    <linearGradient id="spear-blade-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb4ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="spear-blade-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d4ff"/>
      <stop offset="1" stop-color="#5a6fe0"/>
    </linearGradient>
    <radialGradient id="spear-aura" cx="960" cy="150" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fa2ff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#5b5be0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3b2fa0" stop-opacity="0"/>
    </radialGradient>
    <filter id="spear-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .spear-ring { fill: none; stroke: #d6dcff; }
      .spear-runes path { fill: none; stroke: #eef1ff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .spear-spark { fill: #ffffff; }
      .spear-ribbon path { fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Aura del sigillo -->
  <circle cx="960" cy="150" r="170" fill="url(#spear-aura)"/>

