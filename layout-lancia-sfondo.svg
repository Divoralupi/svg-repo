<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 430" width="470" height="430">
  <defs>
    <linearGradient id="sc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#1c2850"/>
    </linearGradient>
    <linearGradient id="sc-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2233"/>
      <stop offset="1" stop-color="#120e18"/>
    </linearGradient>
    <linearGradient id="sc-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a4"/>
      <stop offset="0.5" stop-color="#c9a24f"/>
      <stop offset="1" stop-color="#8a6a2c"/>
    </linearGradient>
    <linearGradient id="sc-shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a3c"/>
      <stop offset="0.4" stop-color="#4a3820"/>
      <stop offset="1" stop-color="#120c06"/>
    </linearGradient>
    <linearGradient id="sc-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#cfd8ff"/>
      <stop offset="1" stop-color="#6c7ff0"/>
    </linearGradient>
    <radialGradient id="sc-impact" cx="100.0" cy="395" r="90" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 395) scale(1 0.35) translate(0 -395)">
      <stop offset="0" stop-color="#9fb0ff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#5b6ae0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3b2fa0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sc-frame"><rect width="470" height="430" rx="24"/></clipPath>
    <clipPath id="sc-above"><rect width="470" height="395"/></clipPath>
    <filter id="sc-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tutto il contenuto è ritagliato dalla cornice ad angoli arrotondati -->
  <g clip-path="url(#sc-frame)">
  <!-- Cielo e stelle -->
  <rect width="470" height="430" fill="url(#sc-sky)"/>
  <g fill="#cfd8ff">
    <circle cx="155.7" cy="59.8" r="0.7" opacity="0.44"/><circle cx="251.1" cy="130.7" r="0.7" opacity="0.85"/><circle cx="106.6" cy="38.4" r="1.4" opacity="0.43"/><circle cx="50.8" cy="150.1" r="0.7" opacity="0.87"/><circle cx="37.8" cy="203.2" r="0.7" opacity="0.89"/><circle cx="31.0" cy="293.3" r="1.1" opacity="0.61"/><circle cx="56.4" cy="198.5" r="0.9" opacity="0.59"/><circle cx="256.5" cy="30.7" r="0.7" opacity="0.71"/><circle cx="233.4" cy="185.5" r="1.1" opacity="0.63"/><circle cx="425.5" cy="129.3" r="0.9" opacity="0.80"/><circle cx="324.5" cy="90.6" r="1.1" opacity="0.66"/><circle cx="139.6" cy="333.5" r="0.7" opacity="0.66"/><circle cx="84.2" cy="122.9" r="1.4" opacity="0.61"/><circle cx="442.9" cy="35.6" r="1.1" opacity="0.57"/><circle cx="167.6" cy="173.9" r="1.4" opacity="0.43"/><circle cx="52.1" cy="99.1" r="0.7" opacity="0.43"/><circle cx="456.9" cy="281.2" r="1.1" opacity="0.76"/><circle cx="409.2" cy="124.5" r="1.4" opacity="0.58"/><circle cx="108.2" cy="104.9" r="0.9" opacity="0.60"/><circle cx="84.9" cy="142.5" r="1.1" opacity="0.84"/><circle cx="135.3" cy="147.0" r="1.1" opacity="0.74"/><circle cx="181.2" cy="86.1" r="0.7" opacity="0.49"/><circle cx="114.4" cy="87.0" r="1.4" opacity="0.82"/><circle cx="92.1" cy="103.0" r="0.9" opacity="0.61"/><circle cx="176.2" cy="196.9" r="0.9" opacity="0.75"/><circle cx="314.3" cy="27.8" r="1.4" opacity="0.60"/><circle cx="187.4" cy="168.9" r="1.4" opacity="0.43"/><circle cx="40.3" cy="78.9" r="0.9" opacity="0.45"/><circle cx="280.3" cy="43.8" r="0.9" opacity="0.67"/>
  </g>
  <path d="M360,43 L361.26,50.74 L369,52 L361.26,53.26 L360,61 L358.74,53.26 L351,52 L358.74,50.74 Z M70,84 L70.84,89.16 L76,90 L70.84,90.84 L70,96 L69.16,90.84 L64,90 L69.16,89.16 Z M425,103 L425.7,107.3 L430,108 L425.7,108.7 L425,113 L424.3,108.7 L420,108 L424.3,107.3 Z M130,245 L130.7,249.3 L135,250 L130.7,250.7 L130,255 L129.3,250.7 L125,250 L129.3,249.3 Z" fill="#e6ebff" filter="url(#sc-glow)"/>

  <!-- Terreno -->
  <rect x="0" y="355" width="470" height="75" fill="url(#sc-ground)"/>
  <path d="M0,355 H470" stroke="url(#sc-gold)" stroke-width="2" opacity="0.6"/>

  <!-- Impatto: bagliore, crepe e anello runico -->
  <ellipse cx="100.0" cy="395" rx="90" ry="32" fill="url(#sc-impact)"/>
  <g fill="none" stroke="#9fb0ff" stroke-width="1.4" stroke-linecap="round" filter="url(#sc-glow)">
    <ellipse cx="100.0" cy="395" rx="66" ry="16" stroke-width="1.2"/>
    <ellipse cx="100.0" cy="395" rx="50" ry="11" stroke-width="0.8" opacity="0.7"/>
    <g stroke="#e6ebff" stroke-width="1.1"><path d="M0,-5 V5 M0,-5 L3,-2 M0,-1 L3,-4" transform="translate(158.0,395.0) scale(1,0.45)"/><path d="M-2,5 V-5 L3,-1 V5" transform="translate(152.2,400.6) scale(1,0.45)"/><path d="M-2,-5 V5 M-2,-2 L2,0 L-2,2" transform="translate(136.2,405.2) scale(1,0.45)"/><path d="M-3,-5 L3,5 M3,-5 L-3,5" transform="translate(112.9,407.7) scale(1,0.45)"/><path d="M0,-5 V5 M-3,-2 L3,2" transform="translate(87.1,407.7) scale(1,0.45)"/><path d="M-3,0 L0,-5 L3,0 L0,5 Z" transform="translate(63.8,405.2) scale(1,0.45)"/><path d="M0,5 V-5 M0,-5 L-3,-2 M0,-5 L3,-2" transform="translate(47.7,400.6) scale(1,0.45)"/><path d="M0,-5 V5 M0,-5 L3,-2 M0,-1 L3,-4" transform="translate(42.0,395.0) scale(1,0.45)"/><path d="M-2,5 V-5 L3,-1 V5" transform="translate(47.7,389.4) scale(1,0.45)"/><path d="M-2,-5 V5 M-2,-2 L2,0 L-2,2" transform="translate(63.8,384.8) scale(1,0.45)"/><path d="M-3,-5 L3,5 M3,-5 L-3,5" transform="translate(87.1,382.3) scale(1,0.45)"/><path d="M0,-5 V5 M-3,-2 L3,2" transform="translate(112.9,382.3) scale(1,0.45)"/><path d="M-3,0 L0,-5 L3,0 L0,5 Z" transform="translate(136.2,384.8) scale(1,0.45)"/><path d="M0,5 V-5 M0,-5 L-3,-2 M0,-5 L3,-2" transform="translate(152.2,389.4) scale(1,0.45)"/></g>
    <path d="M96.0,397 l-18,6 l-10,10 M103.0,397 l14,8 l6,12 M100.0,398 l-2,14" stroke="#cfd8ff" stroke-width="1.2"/>
  </g>
  <!-- Lancia (la parte sotto il terreno viene coperta dal suolo) -->
  <g clip-path="url(#sc-above)"><g transform="translate(224.6,25) rotate(108.61)">
    <ellipse cx="-4" cy="0" rx="7" ry="6" fill="url(#sc-gold)"/>
    <rect x="0" y="-4.5" width="10" height="9" fill="url(#sc-gold)"/>
    <rect x="10" y="-3.5" width="338.9" height="7" fill="url(#sc-shaft)"/>
    <rect x="10" y="-3.5" width="338.9" height="1.5" fill="#d8b878" opacity="0.5"/>
    <rect x="348.9" y="-5" width="12" height="10" fill="url(#sc-gold)"/>
    <g filter="url(#sc-glow)">
      <path d="M360.9,0 L372.9,-12 L394.9,-6 L418.9,0 L394.9,6 L372.9,12 Z" fill="url(#sc-blade)"/>
      <path d="M360.9,0 H418.9" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g></g>

  <!-- zolle di terra sollevate -->
  <path d="M80.0,399 C83.0,391 90.0,389 95.0,391 C99.0,387 106.0,388 109.0,392 C115.0,391 120.0,395 121.0,399 Z" fill="#2c2336"/>
  <path d="M82.0,395 C86.0,390 91.0,389 95.0,391 C99.0,387 106.0,388 109.0,392 C114.0,391 118.0,394 119.0,396" fill="none" stroke="#7d8fe0" stroke-width="1" opacity="0.7"/>
  <path d="M72.0,398 l3,-3 l4,1 l1,3 Z M126.0,397 l2,-4 l4,2 l0,3 Z M66.0,393 l2,-2 l2,1 l0,2 Z" fill="#3a2f45"/>

  <!-- Box del testo -->
  <rect x="240" y="140" width="200" height="170" rx="20" fill="#0e1530" fill-opacity="0.88" stroke="url(#sc-gold)" stroke-width="3"/>
  <rect x="246" y="146" width="188" height="158" rx="15" fill="none" stroke="#c9a24f" stroke-width="0.8" opacity="0.6"/>

  </g>

  <!-- Cornice -->
  <rect x="1.5" y="1.5" width="467" height="427" rx="22.5" fill="none" stroke="url(#sc-gold)" stroke-width="3"/>
</svg>
