<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560">
  <defs>
    <linearGradient id="sc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#1c2850"/>
    </linearGradient>
    <linearGradient id="sc-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2233"/>
      <stop offset="1" stop-color="#120e18"/>
    </linearGradient>
    <linearGradient id="sc-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a4"/>
      <stop offset="0.5" stop-color="#c9a24f"/>
      <stop offset="1" stop-color="#8a6a2c"/>
    </linearGradient>
    <linearGradient id="sc-shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a3c"/>
      <stop offset="0.4" stop-color="#4a3820"/>
      <stop offset="1" stop-color="#120c06"/>
    </linearGradient>
    <linearGradient id="sc-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#cfd8ff"/>
      <stop offset="1" stop-color="#6c7ff0"/>
    </linearGradient>
    <radialGradient id="sc-impact" cx="83.4" cy="490" r="90" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 490) scale(1 0.35) translate(0 -490)">
      <stop offset="0" stop-color="#9fb0ff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#5b6ae0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3b2fa0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sc-above"><rect width="420" height="490"/></clipPath>
    <filter id="sc-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cielo e stelle -->
  <rect width="420" height="560" fill="url(#sc-sky)"/>
  <g fill="#cfd8ff">
    <circle cx="139.5" cy="79.4" r="0.7" opacity="0.44"/><circle cx="224.4" cy="178.2" r="0.7" opacity="0.85"/><circle cx="95.9" cy="49.5" r="1.4" opacity="0.43"/><circle cx="46.3" cy="205.3" r="0.7" opacity="0.87"/><circle cx="34.7" cy="279.3" r="0.7" opacity="0.89"/><circle cx="28.6" cy="404.9" r="1.1" opacity="0.61"/><circle cx="51.2" cy="272.8" r="0.9" opacity="0.59"/><circle cx="229.1" cy="38.9" r="0.7" opacity="0.71"/><circle cx="379.4" cy="176.3" r="0.9" opacity="0.80"/><circle cx="289.6" cy="122.3" r="1.1" opacity="0.66"/><circle cx="125.2" cy="460.9" r="0.7" opacity="0.66"/><circle cx="76.0" cy="167.3" r="1.4" opacity="0.61"/><circle cx="394.8" cy="45.7" r="1.1" opacity="0.57"/><circle cx="150.1" cy="238.5" r="1.4" opacity="0.43"/><circle cx="47.4" cy="134.2" r="0.7" opacity="0.43"/><circle cx="407.2" cy="388.1" r="1.1" opacity="0.76"/><circle cx="364.8" cy="169.6" r="1.4" opacity="0.58"/><circle cx="97.3" cy="142.2" r="0.9" opacity="0.60"/><circle cx="76.5" cy="194.8" r="1.1" opacity="0.84"/><circle cx="121.4" cy="201.0" r="1.1" opacity="0.74"/><circle cx="162.2" cy="116.1" r="0.7" opacity="0.49"/><circle cx="102.8" cy="117.3" r="1.4" opacity="0.82"/><circle cx="82.9" cy="139.7" r="0.9" opacity="0.61"/><circle cx="157.7" cy="270.5" r="0.9" opacity="0.75"/><circle cx="280.5" cy="34.8" r="1.4" opacity="0.60"/><circle cx="167.6" cy="231.5" r="1.4" opacity="0.43"/><circle cx="36.9" cy="106.0" r="0.9" opacity="0.45"/>
  </g>
  <path d="M330,61 L331.26,68.74 L339,70 L331.26,71.26 L330,79 L328.74,71.26 L321,70 L328.74,68.74 Z M60,114 L60.84,119.16 L66,120 L60.84,120.84 L60,126 L59.16,120.84 L54,120 L59.16,119.16 Z M370,145 L370.7,149.3 L375,150 L370.7,150.7 L370,155 L369.3,150.7 L365,150 L369.3,149.3 Z M120,295 L120.7,299.3 L125,300 L120.7,300.7 L120,305 L119.3,300.7 L115,300 L119.3,299.3 Z" fill="#e6ebff" filter="url(#sc-glow)"/>

  <!-- Terreno -->
  <rect x="0" y="490" width="420" height="70" fill="url(#sc-ground)"/>
  <path d="M0,490 H420" stroke="url(#sc-gold)" stroke-width="2" opacity="0.6"/>

  <!-- Impatto: bagliore, crepe e anello runico -->
  <ellipse cx="83.4" cy="490" rx="90" ry="32" fill="url(#sc-impact)"/>
  <g fill="none" stroke="#9fb0ff" stroke-width="1.4" stroke-linecap="round" filter="url(#sc-glow)">
    <ellipse cx="83.4" cy="490" rx="66" ry="16" stroke-width="1.2"/>
    <ellipse cx="83.4" cy="490" rx="50" ry="11" stroke-width="0.8" opacity="0.7"/>
    <g stroke="#e6ebff" stroke-width="1.1"><path d="M0,-5 V5 M0,-5 L3,-2 M0,-1 L3,-4" transform="translate(141.4,490.0) scale(1,0.45)"/><path d="M-2,5 V-5 L3,-1 V5" transform="translate(135.7,495.6) scale(1,0.45)"/><path d="M-2,-5 V5 M-2,-2 L2,0 L-2,2" transform="translate(119.6,500.2) scale(1,0.45)"/><path d="M-3,-5 L3,5 M3,-5 L-3,5" transform="translate(96.3,502.7) scale(1,0.45)"/><path d="M0,-5 V5 M-3,-2 L3,2" transform="translate(70.5,502.7) scale(1,0.45)"/><path d="M-3,0 L0,-5 L3,0 L0,5 Z" transform="translate(47.3,500.2) scale(1,0.45)"/><path d="M0,5 V-5 M0,-5 L-3,-2 M0,-5 L3,-2" transform="translate(31.2,495.6) scale(1,0.45)"/><path d="M0,-5 V5 M0,-5 L3,-2 M0,-1 L3,-4" transform="translate(25.4,490.0) scale(1,0.45)"/><path d="M-2,5 V-5 L3,-1 V5" transform="translate(31.2,484.4) scale(1,0.45)"/><path d="M-2,-5 V5 M-2,-2 L2,0 L-2,2" transform="translate(47.3,479.8) scale(1,0.45)"/><path d="M-3,-5 L3,5 M3,-5 L-3,5" transform="translate(70.5,477.3) scale(1,0.45)"/><path d="M0,-5 V5 M-3,-2 L3,2" transform="translate(96.3,477.3) scale(1,0.45)"/><path d="M-3,0 L0,-5 L3,0 L0,5 Z" transform="translate(119.6,479.8) scale(1,0.45)"/><path d="M0,5 V-5 M0,-5 L-3,-2 M0,-5 L3,-2" transform="translate(135.7,484.4) scale(1,0.45)"/></g>
    <path d="M79.4,492 l-18,6 l-10,10 M86.4,492 l14,8 l6,12 M83.4,493 l-2,14" stroke="#cfd8ff" stroke-width="1.2"/>
  </g>
  <!-- Lancia (la parte sotto il terreno viene coperta dal suolo) -->
  <g clip-path="url(#sc-above)"><g transform="translate(235,40) rotate(108.62)">
    <ellipse cx="-4" cy="0" rx="7" ry="6" fill="url(#sc-gold)"/>
    <rect x="0" y="-4.5" width="10" height="9" fill="url(#sc-gold)"/>
    <rect x="10" y="-3.5" width="421.2" height="7" fill="url(#sc-shaft)"/>
    <rect x="10" y="-3.5" width="421.2" height="1.5" fill="#d8b878" opacity="0.5"/>
    <rect x="431.2" y="-5" width="12" height="10" fill="url(#sc-gold)"/>
    <g filter="url(#sc-glow)">
      <path d="M443.2,0 L455.2,-12 L477.2,-6 L501.2,0 L477.2,6 L455.2,12 Z" fill="url(#sc-blade)"/>
      <path d="M443.2,0 H501.2" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g></g>

  <!-- zolle di terra sollevate -->
  <path d="M69.4,490 l4,-5 l5,2 l3,3 Z M89.4,490 l3,-6 l6,3 l2,3 Z" fill="#3a2f45"/>

  <!-- Box del testo -->
  <rect x="200" y="195" width="200" height="280" rx="22" fill="#0e1530" fill-opacity="0.88" stroke="url(#sc-gold)" stroke-width="3"/>
  <rect x="206" y="201" width="188" height="268" rx="17" fill="none" stroke="#c9a24f" stroke-width="0.8" opacity="0.6"/>

  <!-- Cornice -->
  <rect x="1.5" y="1.5" width="417" height="557" fill="none" stroke="url(#sc-gold)" stroke-width="3"/>
</svg>
