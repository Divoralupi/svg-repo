<!-- Layout "lancia conficcata": solo CSS2, senza position/left/top (rimossi da alcuni editor).
     Lancia, terreno, box e cornice arrotondata sono nello sfondo SVG; il testo viene spostato sopra il box
     con il padding del contenitore (480x560 totali = 234+246 x 347+213).
     Nessun colore di sfondo sul contenitore, così gli angoli arrotondati restano trasparenti. -->
<div style="width:234px;height:347px;padding:213px 0 0 246px;margin:0 auto;background:url('https://cdn.jsdelivr.net/gh/Divoralupi/svg-repo@dc10e02/layout-lancia-sfondo.svg') no-repeat 0 0;">
  <div style="width:168px;height:244px;overflow:auto;font-family:Georgia, 'Times New Roman', serif;font-size:13px;line-height:1.5;color:#e6dcc0;text-align:left;">
    <h2 style="margin:0 0 8px 0;padding:0 0 6px 0;font-size:17px;font-weight:bold;font-variant:small-caps;letter-spacing:1px;color:#f1d898;border-bottom:1px solid #8a6a2c;">Titolo</h2>
    <p style="margin:0 0 8px 0;">Scrivi qui il tuo testo. Se è più lungo dello spazio disponibile, il box diventa scorrevole.</p>
    <p style="margin:0;">Secondo paragrafo di esempio.</p>
  </div>
</div>
