<!-- Layout "lancia conficcata": solo CSS2, senza position/left/top (rimossi da alcuni editor).
     Nuvole, lancia, terreno, box e cornice arrotondata sono nello sfondo SVG del contenitore esterno; le stelline
     animate (GIF trasparente 470x430, stesse coordinate dell'SVG) sono lo sfondo del contenitore interno,
     perché CSS2 non ammette sfondi multipli. Il testo viene spostato sopra il box con il padding del
     contenitore interno (470x430 totali = 214+256 x 274+156).
     Nessun colore di sfondo sui contenitori, così gli angoli arrotondati restano trasparenti. -->
<div style="width:470px;height:430px;margin:0 auto;background:url('https://raw.githubusercontent.com/Divoralupi/svg-repo/143c95a4efb1944c7f4ba2d3175beecad00e0a0c/layout-lancia-sfondo.svg') no-repeat 0 0;">
  <div style="width:214px;height:274px;padding:156px 0 0 256px;background:url('https://raw.githubusercontent.com/Divoralupi/svg-repo/b66feb60b85eabc24d8d3758ee9112262e5590df/stelline-trasparente.gif') no-repeat 0 0;">
    <div style="width:168px;height:138px;overflow:auto;font-family:Georgia, 'Times New Roman', serif;font-size:13px;line-height:1.5;color:#e6dcc0;text-align:left;">
      <h2 style="margin:0 0 8px 0;padding:0 0 6px 0;font-size:17px;font-weight:bold;font-variant:small-caps;letter-spacing:1px;color:#f1d898;border-bottom:1px solid #8a6a2c;">The Lone Spear</h2>
      <p style="margin:0 0 8px 0;">Squadra Holstein, see you soon</p>
    </div>
  </div>
</div>
