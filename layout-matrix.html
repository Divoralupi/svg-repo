<!-- Layout "matrix": solo CSS2, senza position/left/top (rimossi da alcuni editor).
     Pioggia di codice animata (SMIL), barra del titolo, riquadro editor con numeri di riga, box
     "access granted", barra di stato e cornice arrotondata sono tutti nello sfondo SVG del contenitore.
     Il testo viene spostato dentro l'editor con il padding del contenitore interno
     (560x350 totali = 232+328 x 64+286). La line-height di 18px coincide con i numeri di riga dell'SVG.
     Nessun colore di sfondo sui contenitori, così gli angoli arrotondati restano trasparenti. -->
<div style="width:560px;height:350px;margin:0 auto;background:url('https://raw.githubusercontent.com/Divoralupi/svg-repo/main/layout-matrix-sfondo.svg') no-repeat 0 0;">
  <div style="width:328px;height:286px;padding:64px 0 0 232px;">
    <div style="width:304px;height:252px;overflow:auto;font-family:Consolas, 'Courier New', monospace;font-size:12px;line-height:18px;color:#9dffbf;text-align:left;">
      <h2 style="margin:0;padding:0;font-size:12px;line-height:18px;font-weight:bold;color:#6a9c7a;">#!/bin/bash</h2>
      <p style="margin:0;color:#6a9c7a;"># Presentation</p>
      <p style="margin:0 0 18px 0;"><span style="color:#2bff88;">echo</span> "Squadra Holstein, see you soon"</p>
      <p style="margin:0;color:#d9ffe6;">&gt; Wake up, Neo...</p>
    </div>
  </div>
</div>
