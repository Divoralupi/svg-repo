<!-- Layout "circolo druidico": solo CSS2, senza position/left/top (rimossi da alcuni editor).
     Scena notturna in forma di carta dei tarocchi (XVIII, La Luna): quercia, cerchio di pietre, pentacolo rituale, candele,
     cervo, lucciole e foglie animate (SMIL),
     pannello con cornice di corteccia, rampicante, semi dei tarocchi, cerchio arcano e medaglione a pentacolo sono tutti nello sfondo SVG del contenitore.
     Il testo viene spostato dentro il pannello con il padding del contenitore interno
     (530x285 totali = 246+284 x 32+253). Il titolo occupa 24px + 14px di margine, così il divisore
     dell'SVG (y=63) cade tra titolo e testo.
     Nessun colore di sfondo sui contenitori, così gli angoli arrotondati restano trasparenti. -->
<div style="width:530px;height:285px;margin:0 auto;background:url('https://raw.githubusercontent.com/Divoralupi/svg-repo/main/layout-druido-sfondo.svg') no-repeat 0 0;">
  <div style="width:284px;height:253px;padding:32px 0 0 246px;">
    <div style="width:250px;height:224px;overflow:auto;font-family:Georgia, 'Times New Roman', serif;font-size:13px;line-height:1.55;color:#e6e4f2;text-align:left;">
      <h2 style="margin:0 0 14px 0;padding:0;font-size:19px;line-height:24px;font-weight:bold;font-variant:small-caps;letter-spacing:2px;color:#f1e6a6;text-align:center;">Circolo della Luna</h2>
      <p style="margin:0 0 8px 0;">Sono una programmatrice, nel tempo libero mi piace disegnare e giocare.</p>
      <p style="margin:0;font-style:italic;color:#c9bcff;">Per la triplice luna: così sia.</p>
    </div>
  </div>
</div>
