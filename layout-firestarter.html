<!-- Layout "firestarter": solo CSS2, senza position/left/top (rimossi da alcuni editor).
     Fotogramma del video vettorializzato con vtracer, più fari, nebbia, bagliore e braci animate (SMIL)
     e pannello con cornice cromata a spine: tutto nello sfondo SVG del contenitore.
     Il testo viene spostato dentro il pannello con il padding del contenitore interno
     (500x350 totali = 200+300 x 50+300). Il titolo occupa 24px + 8px di margine, così il divisore
     dell'SVG (y=78) cade tra titolo e testo.
     Nessun colore di sfondo sui contenitori, così gli angoli arrotondati restano trasparenti. -->
<div style="width:500px;height:350px;margin:0 auto;background:url('https://raw.githubusercontent.com/Divoralupi/svg-repo/main/layout-firestarter-sfondo.svg') no-repeat 0 0;">
  <div style="width:300px;height:300px;padding:50px 0 0 200px;">
    <div style="width:268px;height:240px;overflow:auto;font-family:Arial, Helvetica, sans-serif;font-size:13px;line-height:1.55;color:#f6e8f3;text-align:left;">
      <h2 style="margin:0 0 8px 0;padding:0;font-family:Impact, 'Arial Black', sans-serif;font-size:21px;line-height:24px;font-weight:normal;font-style:italic;letter-spacing:3px;color:#ffc2ea;text-align:center;">FIRESTARTER</h2>
      <p style="margin:0 0 8px 0;">Squadra Holstein, see you soon</p>
      <p style="margin:0;font-style:italic;color:#ff9a7a;">Una scintilla basta ad accendere il palco.</p>
    </div>
  </div>
</div>
